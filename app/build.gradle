plugins { id 'com.android.application' }

android {
    namespace 'dev.gymgrid.app'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.gymgrid.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    def keyFile = System.getenv('GYMGRID_KEYSTORE_FILE')
    def releaseKeyPassword = System.getenv('GYMGRID_KEY_PASSWORD')
    def releaseStorePassword = System.getenv('GYMGRID_STORE_PASSWORD')
    if (keyFile && releaseKeyPassword && releaseStorePassword) {
        signingConfigs {
            release {
                storeFile file(keyFile)
                storePassword releaseStorePassword
                keyAlias 'gymgrid'
                keyPassword releaseKeyPassword
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
